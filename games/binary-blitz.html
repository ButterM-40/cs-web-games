<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binary Blitz</title>
<link rel="stylesheet" href="../assets/arcade.css">
<style>
  .stage { text-align: center; }
  .label { color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-size: 14px; }
  #target { font-size: clamp(90px, 20vw, 170px); font-weight: 700; line-height: 1; color: var(--amber); }
  #current { font-size: 26px; margin: 8px 0 26px; }
  #current.match { color: var(--green); }
  #bits { display: flex; justify-content: center; gap: clamp(4px, 1.2vw, 12px); }
  .bit { flex: 0 1 100px; min-width: 0; padding: 0; background: none; border: 0; }
  .bit .place { display: block; color: var(--muted); margin-bottom: 6px; font-size: clamp(13px, 2.4vw, 20px); }
  .bit .face {
    display: block; padding: clamp(14px, 4vw, 32px) 0; font-size: clamp(26px, 6vw, 50px); font-weight: 700;
    background: var(--panel-2); border: 3px solid var(--line); border-radius: 10px;
  }
  .bit.on .face { background: var(--green); border-color: var(--green); color: #06281a; }
  .bit[hidden] { display: none; }
  #flash { min-height: 32px; margin-top: 22px; color: var(--green); font-size: 22px; }
</style>
</head>
<body data-pad-hint="Controller: D-pad or stick to pick, A to press. Keyboard: arrow keys and Enter.">
<header class="bar">
  <a href="../index.html">&larr; All games</a>
  <h1>Binary Blitz</h1>
  <div class="stats">
    <div class="stat" id="timeStat"><small>Time</small><b id="time">45</b></div>
    <div class="stat"><small>Score</small><b id="score">0</b></div>
  </div>
</header>

<div class="stage">
  <div class="label">Build this number</div>
  <div id="target">?</div>
  <div id="current">Your bits add up to 0</div>
  <div id="bits"></div>
  <div id="flash" aria-live="polite"></div>
</div>

<script src="../assets/arcade.js"></script>
<script>
  const PLACES = [128, 64, 32, 16, 8, 4, 2, 1];
  const FAST_MS = 3000;
  const $ = (id) => document.getElementById(id);

  let target = 0, value = 0, score = 0, solved = 0, width = 4;
  let endsAt = 0, roundStart = 0, running = false;

  const buttons = PLACES.map((place) => {
    const b = Arcade.el("button", { className: "bit", type: "button" }, [
      Arcade.el("span", { className: "place", textContent: place }),
      Arcade.el("span", { className: "face", textContent: "0" }),
    ]);
    b.addEventListener("click", () => toggle(place));
    $("bits").append(b);
    return { place, b };
  });

  function widthForProgress() {
    if (solved < 3) return 4;
    if (solved < 7) return 5;
    if (solved < 12) return 6;
    return 8;
  }

  function draw() {
    buttons.forEach(({ place, b }) => {
      const on = (value & place) !== 0;
      b.hidden = place >= 2 ** width;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", on);
      b.querySelector(".face").textContent = on ? "1" : "0";
    });
    const parts = buttons.filter(({ place }) => value & place).map(({ place }) => place);
    $("current").textContent = parts.length > 1
      ? parts.join(" + ") + " = " + value
      : "Your bits add up to " + value;
    $("current").classList.toggle("match", value === target);
    $("score").textContent = score;
  }

  function nextNumber() {
    width = widthForProgress();
    const previous = target;
    do { target = 1 + Math.floor(Math.random() * (2 ** width - 1)); } while (target === previous);
    value = 0;
    roundStart = performance.now();
    $("target").textContent = target;
    draw();
  }

  function toggle(place) {
    if (!running) return;
    value ^= place;
    if (value === target) solve();
    else draw();
  }

  function solve() {
    const fast = performance.now() - roundStart < FAST_MS;
    score += width * 10 + (fast ? 20 : 0);
    solved++;
    endsAt += 2000;
    $("flash").textContent = (fast ? "Lightning fast! " : "Correct! ") + target + " = " + target.toString(2) + " in binary";
    nextNumber();
  }

  function tick() {
    if (!running) return;
    const left = Math.max(0, endsAt - performance.now());
    $("time").textContent = Math.ceil(left / 1000);
    $("timeStat").classList.toggle("warn", left < 10000);
    if (left <= 0) {
      running = false;
      Arcade.over({
        game: "binary",
        score,
        headline: solved + " number" + (solved === 1 ? "" : "s") + " built",
        lesson: "Every photo, song and game on your phone is stored as patterns of 1s and 0s just like these.",
      });
      return;
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener("keydown", (e) => {
    const n = Number(e.key);
    if (!running || !(n >= 1 && n <= width)) return;
    toggle(2 ** (width - n));
  });

  Arcade.watchIdle();
  draw();
  Arcade.intro({
    title: "Binary Blitz",
    how: [
      "Tap bits to turn them on. Each one is worth the number above it.",
      "Make the bits add up to the big number.",
      "Every correct answer adds 2 seconds. It gets harder as you go!",
    ],
    onStart() {
      running = true;
      endsAt = performance.now() + 45000;
      nextNumber();
      tick();
    },
  });
</script>
</body>
</html>
