<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Breaker</title>
<link rel="stylesheet" href="../assets/arcade.css">
<style>.view canvas { cursor: none; }</style>
</head>
<body class="canvas-game" data-pad-hint="Controller: stick or D-pad to move, A to launch.">
<header class="bar">
  <a href="../index.html">&larr; All games</a>
  <h1>Neon Breaker</h1>
  <div class="stats">
    <div class="stat"><small>Level</small><b id="level">1</b></div>
    <div class="stat"><small>Lives</small><b id="lives">3</b></div>
    <div class="stat"><small>Score</small><b id="score">0</b></div>
  </div>
</header>
<div class="view"><canvas id="c"></canvas></div>

<script src="../assets/arcade.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const canvas = $("c");
  const ctx = canvas.getContext("2d");
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // Everything runs in an 800x600 field that is scaled to fit the window.
  const LW = 800, LH = 600;
  const COLS = 10, ROWS = 7, BW = 72, BH = 24, GAP = 4, LEFT = 22, TOP_Y = 70;
  const PY = 560, PH = 14, BALL_R = 8;
  const BRICK_COLORS = { 1: "#5dc8ff", 2: "#c99bff", 3: "#ff5d8f" };
  const CAPS = { W: "#5dffa0", M: "#ffc94d", S: "#5dc8ff" };

  let W = 0, H = 0, S = 1, OX = 0, OY = 0;
  let state = "intro", level = 1, lives = 3, score = 0;
  let paddle = { x: LW / 2, w: 110, target: LW / 2 };
  let balls = [], bricks = [], caps = [], parts = [], stuck = true;
  let wideT = 0, slowT = 0, banner = { text: "", life: 0 }, deadTimer = 0;
  const keys = new Set();

  function resize() {
    ({ w: W, h: H } = Arcade.fitCanvas(canvas, ctx));
    S = Math.min(W / LW, H / LH);
    OX = (W - LW * S) / 2;
    OY = (H - LH * S) / 2;
  }

  function pattern(r, c, lvl) {
    const p = (lvl - 1) % 4;
    let h;
    if (p === 0) h = r === 0 ? 2 : 1;
    else if (p === 1) h = (r + c) % 2 === 0 ? (r < 3 ? 2 : 1) : 0;
    else if (p === 2) h = Math.abs(c - 4.5) + Math.abs(r - 3) <= 4.5 ? (r === 3 ? 3 : r % 2 ? 2 : 1) : 0;
    else h = c % 3 === 2 ? 0 : r < 2 ? 2 : 1;
    return h ? Math.min(3, h + Math.floor((lvl - 1) / 4)) : 0;
  }

  function buildLevel() {
    bricks = [];
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        const hits = pattern(r, c, level);
        if (hits) bricks.push({ x: LEFT + c * (BW + GAP), y: TOP_Y + r * (BH + GAP), hits });
      }
    caps = [];
    banner = { text: "LEVEL " + level, life: 1.6 };
    resetBall();
  }

  function resetBall() {
    balls = [{ x: paddle.x, y: PY - BALL_R - 1, vx: 0, vy: 0 }];
    stuck = true;
  }

  const ballSpeed = () => Math.min(650, 360 + level * 35) * (slowT > 0 ? 0.7 : 1);

  function launch() {
    if (state !== "play" || !stuck) return;
    const a = rand(-0.4, 0.4), sp = ballSpeed();
    balls[0].vx = Math.sin(a) * sp;
    balls[0].vy = -Math.cos(a) * sp;
    stuck = false;
  }

  function burst(x, y, color) {
    for (let i = 0; i < 12; i++) {
      const life = rand(0.3, 0.7);
      parts.push({ x, y, vx: rand(-220, 220), vy: rand(-220, 220), life, max: life, color });
    }
  }

  function hitBrick(br) {
    br.hits--;
    score += 10 * level;
    burst(br.x + BW / 2, br.y + BH / 2, BRICK_COLORS[br.hits + 1]);
    if (br.hits > 0) return;
    bricks.splice(bricks.indexOf(br), 1);
    if (Math.random() < 0.13) {
      const type = ["W", "M", "S"][Math.floor(Math.random() * 3)];
      caps.push({ x: br.x + BW / 2, y: br.y + BH / 2, type });
    }
    if (!bricks.length) {
      level++;
      score += 250;
      buildLevel();
    }
  }

  function catchCap(type) {
    if (type === "W") wideT = 12;
    if (type === "S") slowT = 10;
    if (type === "M") {
      if (stuck) launch();
      const src = balls[0];
      for (const turn of [-0.5, 0.5]) {
        const c = Math.cos(turn), s = Math.sin(turn);
        balls.push({ x: src.x, y: src.y, vx: src.vx * c - src.vy * s, vy: src.vx * s + src.vy * c });
      }
    }
    banner = { text: { W: "WIDE PADDLE", M: "MULTI-BALL", S: "SLOW BALL" }[type], life: 1.2 };
  }

  function stepBall(b, h) {
    const px = b.x, py = b.y;
    b.x += b.vx * h;
    b.y += b.vy * h;
    if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx); }
    if (b.x > LW - BALL_R) { b.x = LW - BALL_R; b.vx = -Math.abs(b.vx); }
    if (b.y < BALL_R) { b.y = BALL_R; b.vy = Math.abs(b.vy); }

    const half = paddle.w / 2;
    if (b.vy > 0 && b.y + BALL_R >= PY && py + BALL_R <= PY + 6 && b.x >= paddle.x - half - BALL_R && b.x <= paddle.x + half + BALL_R) {
      // Where it lands on the paddle decides the bounce angle.
      const ang = clamp((b.x - paddle.x) / half, -1, 1) * 1.05;
      const sp = Math.hypot(b.vx, b.vy);
      b.vx = Math.sin(ang) * sp;
      b.vy = -Math.cos(ang) * sp;
      b.y = PY - BALL_R;
      return;
    }

    for (const br of bricks) {
      const cx = clamp(b.x, br.x, br.x + BW), cy = clamp(b.y, br.y, br.y + BH);
      if ((b.x - cx) ** 2 + (b.y - cy) ** 2 >= BALL_R * BALL_R) continue;
      if (px < br.x || px > br.x + BW) b.vx = -b.vx;
      else b.vy = -b.vy;
      b.x = px;
      b.y = py;
      hitBrick(br);
      break;
    }
  }

  function update(dt) {
    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
    parts = parts.filter((p) => p.life > 0);
    banner.life -= dt;
    if (state === "dead") {
      deadTimer -= dt;
      if (deadTimer <= 0) {
        state = "over";
        Arcade.over({ game: "breaker", score, headline: "Game over", lesson: "You reached level " + level + "." });
      }
      return;
    }
    if (state !== "play") return;

    wideT = Math.max(0, wideT - dt);
    slowT = Math.max(0, slowT - dt);
    const targetW = wideT > 0 ? 170 : 110;
    paddle.w += (targetW - paddle.w) * Math.min(1, dt * 8);
    const kx = (keys.has("ArrowRight") || keys.has("d") ? 1 : 0) - (keys.has("ArrowLeft") || keys.has("a") ? 1 : 0);
    if (kx) paddle.target += kx * 750 * dt;
    paddle.target = clamp(paddle.target, paddle.w / 2, LW - paddle.w / 2);
    paddle.x = paddle.target;

    if (stuck) {
      balls[0].x = paddle.x;
      balls[0].y = PY - BALL_R - 1;
    } else {
      const sp = ballSpeed();
      for (const b of balls) {
        // Keep a constant speed and never let the ball travel almost flat.
        const cur = Math.hypot(b.vx, b.vy) || 1;
        b.vx *= sp / cur;
        b.vy *= sp / cur;
        if (Math.abs(b.vy) < sp * 0.35) {
          b.vy = Math.sign(b.vy || -1) * sp * 0.35;
          b.vx = Math.sign(b.vx || 1) * Math.sqrt(sp * sp - b.vy * b.vy);
        }
        const steps = Math.ceil((sp * dt) / 4);
        for (let i = 0; i < steps; i++) stepBall(b, dt / steps);
      }
      balls = balls.filter((b) => b.y < LH + 20);
      if (!balls.length) {
        lives--;
        wideT = slowT = 0;
        if (lives <= 0) {
          state = "dead";
          deadTimer = 0.8;
          return;
        }
        banner = { text: "BALL LOST", life: 1.2 };
        resetBall();
      }
    }

    for (const c of caps) c.y += 170 * dt;
    caps = caps.filter((c) => {
      if (c.y + 9 >= PY && c.y - 9 <= PY + PH && Math.abs(c.x - paddle.x) < paddle.w / 2 + 14) {
        catchCap(c.type);
        return false;
      }
      return c.y < LH + 20;
    });
  }

  function draw() {
    ctx.fillStyle = "#03050c";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S, S);
    ctx.fillStyle = "#070b17";
    ctx.fillRect(0, 0, LW, LH);
    ctx.strokeStyle = "#33406b";
    ctx.lineWidth = 3;
    ctx.strokeRect(-1.5, -1.5, LW + 3, LH + 3);

    for (const br of bricks) {
      ctx.fillStyle = BRICK_COLORS[br.hits];
      ctx.beginPath();
      ctx.roundRect(br.x, br.y, BW, BH, 5);
      ctx.fill();
      ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
      ctx.fillRect(br.x + 4, br.y + 3, BW - 8, 5);
    }

    for (const p of parts) {
      ctx.globalAlpha = p.life / p.max;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 14px Consolas, monospace";
    for (const c of caps) {
      ctx.fillStyle = CAPS[c.type];
      ctx.beginPath();
      ctx.roundRect(c.x - 18, c.y - 9, 36, 18, 9);
      ctx.fill();
      ctx.fillStyle = "#06101f";
      ctx.fillText(c.type, c.x, c.y + 1);
    }

    ctx.shadowColor = wideT > 0 ? "#5dffa0" : "#5dc8ff";
    ctx.shadowBlur = 16;
    ctx.fillStyle = wideT > 0 ? "#5dffa0" : "#5dc8ff";
    ctx.beginPath();
    ctx.roundRect(paddle.x - paddle.w / 2, PY, paddle.w, PH, 7);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#ffffff";
    for (const b of balls) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    if (banner.life > 0) {
      ctx.globalAlpha = Math.min(1, banner.life * 2);
      ctx.fillStyle = "#ffc94d";
      ctx.font = "bold 44px Consolas, monospace";
      ctx.fillText(banner.text, LW / 2, 360);
      ctx.globalAlpha = 1;
    }
    if (state === "play" && stuck) {
      ctx.fillStyle = "#a4b0d4";
      ctx.font = "18px Consolas, monospace";
      ctx.fillText("Click, tap or press space to launch", LW / 2, 470);
    }
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    $("level").textContent = level;
    $("lives").textContent = Math.max(0, lives);
    $("score").textContent = score;
    requestAnimationFrame(frame);
  }

  const toField = (e) => {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left - OX) / S;
  };
  canvas.addEventListener("pointermove", (e) => { paddle.target = toField(e); });
  canvas.addEventListener("pointerdown", (e) => {
    canvas.setPointerCapture(e.pointerId);
    paddle.target = toField(e);
    launch();
  });
  window.addEventListener("keydown", (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    keys.add(k);
    if (k === " " && state === "play") { e.preventDefault(); launch(); }
    if (k.startsWith("Arrow")) e.preventDefault();
  });
  window.addEventListener("keyup", (e) => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
  window.addEventListener("resize", resize);

  resize();
  buildLevel();
  banner.life = 0;
  Arcade.watchIdle();
  requestAnimationFrame(frame);
  Arcade.intro({
    title: "Neon Breaker",
    how: [
      "Move the paddle with your mouse, finger or arrow keys.",
      "Bounce the ball to smash every brick. Purple and pink bricks take extra hits.",
      "Catch falling capsules: W = wide paddle, M = multi-ball, S = slow ball.",
      "Clear the board to reach the next level. You have 3 lives.",
    ],
    button: "Play!",
    onStart() {
      state = "play";
      banner = { text: "LEVEL 1", life: 1.6 };
    },
  });
</script>
</body>
</html>
