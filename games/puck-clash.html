<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puck Clash</title>
<link rel="stylesheet" href="../assets/arcade.css">
<style>.view canvas { cursor: none; }</style>
</head>
<body class="canvas-game" data-pad-hint="Controllers: the first one plays Pink, the second plays Cyan.">
<header class="bar">
  <a href="../index.html">&larr; All games</a>
  <h1>Puck Clash</h1>
  <div class="stats">
    <div class="stat"><small id="name0">Pink</small><b id="score0" style="color: var(--pink)">0</b></div>
    <div class="stat"><small id="name1">Cyan</small><b id="score1" style="color: var(--blue)">0</b></div>
  </div>
</header>
<div class="view"><canvas id="c"></canvas></div>

<script src="../assets/arcade.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const canvas = $("c");
  const ctx = canvas.getContext("2d");
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const LW = 1000, LH = 560, GOAL = 200, MR = 34, PR = 20, WIN = 7, MAX_PUCK = 1500;
  const COLORS = ["#ff5d8f", "#5dc8ff"];
  let W = 0, H = 0, S = 1, OX = 0, OY = 0;
  let mode = 1, state = "menu", scores = [0, 0], message = "", messageT = 0, serveSide = 0;
  let mallets = [], puck = {};
  const keys = new Set();
  const pointers = new Map();

  const names = () => ["Pink", mode === 1 ? "CPU" : "Cyan"];

  function resize() {
    ({ w: W, h: H } = Arcade.fitCanvas(canvas, ctx));
    S = Math.min((W - 16) / LW, (H - 16) / LH);
    OX = (W - LW * S) / 2;
    OY = (H - LH * S) / 2;
  }

  function hud() {
    names().forEach((n, i) => {
      $("name" + i).textContent = n;
      $("score" + i).textContent = scores[i];
    });
  }

  function placePieces() {
    mallets = [
      { x: 120, y: LH / 2, vx: 0, vy: 0, tx: 120, ty: LH / 2 },
      { x: LW - 120, y: LH / 2, vx: 0, vy: 0, tx: LW - 120, ty: LH / 2 },
    ];
    puck = { x: serveSide === 0 ? LW * 0.3 : LW * 0.7, y: LH / 2, vx: 0, vy: 0 };
  }

  function startMatch(m) {
    mode = m;
    scores = [0, 0];
    serveSide = Math.random() < 0.5 ? 0 : 1;
    placePieces();
    hud();
    state = "play";
  }

  function cpuThink() {
    const m = mallets[1];
    if (puck.x > LW / 2 - 40) {
      // Get behind the puck (relative to Pink's goal), then drive through it.
      const ax = puck.x, ay = puck.y - LH / 2, al = Math.hypot(ax, ay) || 1;
      if (m.x < puck.x - 10) {
        m.tx = puck.x + 70;
        m.ty = puck.y + (m.y < puck.y ? -60 : 60);
      } else {
        m.tx = puck.x - (ax / al) * 12;
        m.ty = puck.y - (ay / al) * 12;
      }
    } else {
      m.tx = LW - 110;
      m.ty = LH / 2 + clamp(puck.y - LH / 2, -110, 110);
    }
  }

  function moveMallet(m, side, maxSpeed, h) {
    const minX = side === 0 ? MR : LW / 2 + MR, maxX = side === 0 ? LW / 2 - MR : LW - MR;
    const tx = clamp(m.tx, minX, maxX), ty = clamp(m.ty, MR, LH - MR);
    let dx = tx - m.x, dy = ty - m.y;
    const d = Math.hypot(dx, dy), step = maxSpeed * h;
    if (d > step) { dx *= step / d; dy *= step / d; }
    m.x += dx;
    m.y += dy;
    m.vx = dx / h;
    m.vy = dy / h;
  }

  function collide(m) {
    const dx = puck.x - m.x, dy = puck.y - m.y, d = Math.hypot(dx, dy), min = MR + PR;
    if (d >= min || d === 0) return;
    const nx = dx / d, ny = dy / d;
    puck.x = m.x + nx * min;
    puck.y = m.y + ny * min;
    const rel = (puck.vx - m.vx) * nx + (puck.vy - m.vy) * ny;
    if (rel < 0) {
      puck.vx -= 1.9 * rel * nx;
      puck.vy -= 1.9 * rel * ny;
    }
    const sp = Math.hypot(puck.vx, puck.vy);
    if (sp > MAX_PUCK) { puck.vx *= MAX_PUCK / sp; puck.vy *= MAX_PUCK / sp; }
  }

  function goal(scorer) {
    scores[scorer]++;
    hud();
    serveSide = 1 - scorer;
    message = names()[scorer] + " scores!";
    messageT = 1.3;
    state = "goal";
  }

  function stepPhysics(h) {
    const inMouth = Math.abs(puck.y - LH / 2) < GOAL / 2 - PR * 0.3;
    puck.x += puck.vx * h;
    puck.y += puck.vy * h;
    if (puck.y < PR) { puck.y = PR; puck.vy = Math.abs(puck.vy) * 0.9; }
    if (puck.y > LH - PR) { puck.y = LH - PR; puck.vy = -Math.abs(puck.vy) * 0.9; }
    if (inMouth) {
      if (puck.x < -PR) return goal(1);
      if (puck.x > LW + PR) return goal(0);
    } else {
      if (puck.x < PR) { puck.x = PR; puck.vx = Math.abs(puck.vx) * 0.9; }
      if (puck.x > LW - PR) { puck.x = LW - PR; puck.vx = -Math.abs(puck.vx) * 0.9; }
    }
    mallets.forEach(collide);
  }

  function update(dt) {
    if (state === "goal") {
      messageT -= dt;
      if (messageT <= 0) {
        if (Math.max(...scores) >= WIN) return endMatch();
        placePieces();
        state = "play";
      }
      return;
    }
    if (state !== "play") return;

    // Keyboard nudges the target; pointers set it directly.
    const kb = [["w", "s", "a", "d"], ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]];
    kb.forEach(([up, down, left, right], i) => {
      const who = mode === 1 ? 0 : i;
      const kx = (keys.has(right) ? 1 : 0) - (keys.has(left) ? 1 : 0);
      const ky = (keys.has(down) ? 1 : 0) - (keys.has(up) ? 1 : 0);
      if (kx || ky) { mallets[who].tx = mallets[who].x + kx * 80; mallets[who].ty = mallets[who].y + ky * 80; }
    });
    if (mode === 1) cpuThink();

    const steps = 4, h = dt / steps;
    for (let i = 0; i < steps && state === "play"; i++) {
      moveMallet(mallets[0], 0, 2200, h);
      moveMallet(mallets[1], 1, mode === 1 ? 820 : 2200, h);
      stepPhysics(h);
    }
    const f = Math.pow(0.75, dt);
    puck.vx *= f;
    puck.vy *= f;
  }

  function endMatch() {
    state = "menu";
    const winner = scores[0] > scores[1] ? 0 : 1;
    Arcade.intro({
      title: names()[winner] + " wins!",
      how: ["Final score: " + scores[0] + " to " + scores[1]],
      buttons: [
        { label: "Rematch", primary: true, action: () => startMatch(mode) },
        { label: "Change players", action: showMenu },
        { label: "All games", action: Arcade.home },
      ],
    });
  }

  function disc(x, y, r, color, ring) {
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    if (ring) {
      ctx.fillStyle = "rgba(255, 255, 255, 0.35)";
      ctx.beginPath();
      ctx.arc(x, y, r * 0.45, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function draw() {
    ctx.fillStyle = "#03050c";
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.translate(OX, OY);
    ctx.scale(S, S);

    ctx.fillStyle = "#0a1630";
    ctx.beginPath();
    ctx.roundRect(0, 0, LW, LH, 30);
    ctx.fill();
    ctx.strokeStyle = "#33406b";
    ctx.lineWidth = 6;
    ctx.stroke();

    ctx.strokeStyle = "rgba(164, 176, 212, 0.35)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(LW / 2, 0);
    ctx.lineTo(LW / 2, LH);
    ctx.moveTo(LW / 2 + 70, LH / 2);
    ctx.arc(LW / 2, LH / 2, 70, 0, Math.PI * 2);
    ctx.moveTo(0, LH / 2 - 110);
    ctx.arc(0, LH / 2, 110, -Math.PI / 2, Math.PI / 2);
    ctx.moveTo(LW, LH / 2 + 110);
    ctx.arc(LW, LH / 2, 110, Math.PI / 2, Math.PI * 1.5);
    ctx.stroke();

    ctx.font = "bold 160px Consolas, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255, 93, 143, 0.08)";
    ctx.fillText(scores[0], LW / 4, LH / 2);
    ctx.fillStyle = "rgba(93, 200, 255, 0.08)";
    ctx.fillText(scores[1], (LW * 3) / 4, LH / 2);

    [0, 1].forEach((side) => {
      ctx.fillStyle = COLORS[side];
      ctx.shadowColor = COLORS[side];
      ctx.shadowBlur = 20;
      ctx.fillRect(side === 0 ? -6 : LW - 2, LH / 2 - GOAL / 2, 8, GOAL);
    });
    ctx.shadowBlur = 0;

    if (state !== "menu" || mallets.length) {
      if (puck.x !== undefined) disc(puck.x, puck.y, PR, "#ffc94d", false);
      mallets.forEach((m, i) => disc(m.x, m.y, MR, COLORS[i], true));
    }

    if (state === "goal") {
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 64px Consolas, monospace";
      ctx.fillText(message, LW / 2, LH / 2);
    }
    ctx.restore();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  function aimFromPointer(e) {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left - OX) / S, y = (e.clientY - r.top - OY) / S;
    // In two-player mode each pointer drives whichever mallet's half it started on.
    let who = pointers.get(e.pointerId);
    if (who === undefined) who = mode === 1 || x < LW / 2 ? 0 : 1;
    if (e.type === "pointerdown") pointers.set(e.pointerId, who);
    if (!mallets[who]) return;
    mallets[who].tx = x;
    mallets[who].ty = y;
  }
  canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); aimFromPointer(e); });
  canvas.addEventListener("pointermove", (e) => {
    if (e.pointerType === "mouse" && mode === 2 && !pointers.has(e.pointerId)) {
      // A hovering mouse in 2-player mode always steers Pink.
      pointers.set(e.pointerId, 0);
    }
    aimFromPointer(e);
  });
  ["pointerup", "pointercancel"].forEach((t) => canvas.addEventListener(t, (e) => {
    if (e.pointerType !== "mouse") pointers.delete(e.pointerId);
  }));
  window.addEventListener("keydown", (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    keys.add(k);
    if (k.startsWith("Arrow")) e.preventDefault();
  });
  window.addEventListener("keyup", (e) => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
  window.addEventListener("resize", resize);

  function showMenu() {
    state = "menu";
    pointers.clear();
    Arcade.intro({
      title: "Puck Clash",
      how: [
        "Air hockey! Knock the puck into the other player's goal.",
        "Pink: move with the mouse, a finger, or W A S D.",
        "Cyan: arrow keys, or a second finger on a touchscreen.",
        "First to " + WIN + " goals wins.",
      ],
      buttons: [
        { label: "1 Player vs CPU", primary: true, action: () => startMatch(1) },
        { label: "2 Players", primary: true, action: () => startMatch(2) },
      ],
    });
  }

  resize();
  placePieces();
  hud();
  Arcade.watchIdle();
  requestAnimationFrame(frame);
  showMenu();
</script>
</body>
</html>
